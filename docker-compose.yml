services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  generate_raw:
    build:
      context: .
      dockerfile: etl/Dockerfile
      target: runtime
    image: docker-data-project-pipeline:latest
    volumes:
      - ./data:/app/data
    command: ["python", "etl/00_generate_csv.py"]
    restart: "no"

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
      target: runtime
    image: docker-data-project-pipeline:latest
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ./data:/app/data
    depends_on:
      generate_raw:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pg_data:
